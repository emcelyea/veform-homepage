<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veform Playground</title>
    <meta
    name="description"
    content="Veform Playground, try out building and having conversations with forms."
  />
  <link rel="icon" type="image/jpeg" sizes="32x32" href="./larryicon32x32.jpeg"/>
  <link rel="icon" type="image/jpeg" sizes="16x16" href="./larryicon16x16.jpeg"/>
  <link rel="apple-touch-icon" sizes="180x180" href="./larryicon180x180.jpeg"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
    <style>
        :root {
            --primary-light: #6FAE8D;
            --primary: #5A9B7A;
            --primary-dark: #4A8567;
            --secondary-dark: #66527D;
            --secondary: #8F7BA3;
            --accent: #E89B6E;
            --accent-dark: #C76A3A;
            --dark: #3D3426;
            --dark-light: #5A4F3F;
            --gray: #8B7E6B;
            --light: #E8DCC8;
            --white: #3D3426;
            --bg-main: #E8DCC8;
            --bg-alt: #F5EFE3;
        }
        html {
            height: 100%;
        }
        body {
            height: 100%;
            font-family: "Nunito Sans", -apple-system, BlinkMacSystemFont,
                "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", sans-serif;
            background: var(--bg-main);
            color: var(--white);
            overflow-x: hidden;
            margin: 0;
        }
    
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
    
        header {
            background: rgba(232, 220, 200, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(61, 52, 38, 0.2);
            box-shadow: 0 2px 10px rgba(61, 52, 38, 0.1);
        }
    
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            max-width: 1200px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        
        nav a {
            text-decoration: none;
        }
    
        .logo {
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--dark);
        }
    
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }
    
        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            transition: color 0.3s;
        }
    
        nav a:hover {
            color: var(--secondary);
        }
    
        .welcome-message {
            margin-top: 68px;
            margin-left: 16px;
            margin-bottom: 12px;
        }
        .welcome-message h3 {
            margin-bottom: 0;
        }
        .welcome-message p {
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .main-content {
            display: flex;
            flex: 1;
            margin-top: 12px;
        }
    
        .editors {
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
            margin-bottom: 12px;
            min-height: 420px;
        }
    
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    
        .editor-tabs {
            display: flex;
        }
    
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            background: #2d2d30;
            color: var(--white);
            border: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            background: var(--bg-main);
        }
    
        .tab:hover {
            border-bottom-color: var(--primary);
            background: var(--bg-alt);
    
        }
    
        .tab.active {
            border-bottom-color: var(--primary);
            background: var(--bg-alt);
        }
    
        .run-button {
            background: var(--primary-dark);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            border: none;
            height: 32px;
        }
    
        .run-button:hover {
            background: var(--primary);
        }
    
        .run-button:active {
            transform: scale(0.98);
        }
    
        .editor-container {
            flex: 1;
            display: none;
            position: relative;
        }
    
        .editor-container.active {
            display: block;
            overflow: scroll;
        }
    
        .CodeMirror {
            height: 100% !important;
            font-size: 14px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }
    
        .preview {
            flex: 1;
            background: white;
            position: relative;
            margin-bottom: 12px;
            min-height: 420px;
        }
    
        .preview-header {
            background: var(--bg-main);
            padding: 10px 4px;
            color: var(--white);
            font-size: 16px;
            font-weight: 400;
        }
        .gutter {
            background: #f0f0f0;
            cursor: col-resize;
            position: relative;
            transition: background 0.2s ease;
            margin-top: 41px;
            min-height: 420px;
            height: calc(100% - 53px);
        }

        .gutter::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 40px;
            background: #ccc;
            border-radius: 2px;
            transition: background 0.2s ease, height 0.2s ease;
        }

        .gutter:hover {
            background: #e8e8e8;
        }

        .gutter:hover::after {
            background: #777;
            height: 60px;
        }

        .gutter:active::after {
            background: #777;
        }
    
        select {
            background: var(--bg-main);
            color: var(--white);
            font-size: 1rem;
            font-weight: 500;
            background: var(--bg-main);
            max-width: 180px;
            margin-left: 16px;
            padding: 6px;
            border-radius: 8px;
            outline: none;
        }
        #preview-frame {
            width: 100%;
            height: calc(100% - 45px);
            border: none;
            background: white;
        }
    
        @media (max-width: 920px) {
            .main-content {
                flex-direction: column;
                align-items: flex-start;
            }
    
            .editors {
                border-right: none;
                order: 2;
                width: 100% !important;
            }
            .preview {
                width: 100% !important;
                order: 1;
            }
            .tab {
                padding: 12px 16px;
            }
            .welcome-message {
                text-align: center;
                margin-left: 0;
            }
            .run-button {
                margin-right: 4px;
            }
            .gutter {
                display: none;
            }
       
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <a href="https://veform.co"><div class="logo">Veform</div></a>
                <ul class="nav-links">
                    <li><a href="https://veform.co/documentation">Docs</a></li>
                    <li><a href="https://veform.co/playground">Demo</a></li>
                </ul>
            </nav>
        </header>
    
        <div class="welcome-message">
            <h3>Veform Playground</h3>
            <p>Edit code below to try different form configurations.<br/>
            View the <a href="https://veform.co/documentation">Documentation</a> to learn about all the things you can do.</p>
        </div>
        <select id="template-select" onchange="switchTemplate(this.value)">
            <option value="default">-- Templates --</option>
            <option value="text">Text</option>
            <option value="textarea">Textarea</option>
            <option value="yesNo">Yes/No</option>
            <option value="number">Number</option>
            <option value="select">Select</option>
            <option value="multiselect">Multiselect</option>
        </select>
        <div class="main-content">
            <div id="editorSection" class="editors">
                <div class="editor-header">
                    <div class="editor-tabs">
                        <button class="tab active" onclick="switchTab('html')">HTML</button>
                        <button class="tab" onclick="switchTab('css')">CSS</button>
                        <button class="tab" onclick="switchTab('js')">JavaScript</button>
                    </div>
                    <button class="run-button" onclick="runCode()">▶ Run</button>
                </div>
    
                <div id="html-editor" class="editor-container active">
                    <textarea id="html-code"></textarea>
                </div>
    
                <div id="css-editor" class="editor-container">
                    <textarea id="css-code"></textarea>
                </div>
    
                <div id="js-editor" class="editor-container">
                    <textarea id="js-code"></textarea>
                </div>
            </div>

    
            <div id="previewSection" class="preview">
                <div class="preview-header">Preview</div>
                <iframe id="preview-frame"></iframe>
            </div>


        </div>
    
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://unpkg.com/split.js/dist/split.min.js"></script>
    <script>
        Split(['#editorSection', '#previewSection'], {
            sizes: [50,50],
            minSize: 200,
            gutterSize: 16,
            cursor: 'col-resize'
        });
    </script>
    <script>

veform.verbose = true;
document.getElementById('start').addEventListener('click', () => {

        const textTemplate = {
            html: `<body>
    <div class="container">
        <button id="start" class="start">Start conversation</button>
        <label for="name">Name</label>
        <input id="name" type="text"/>
        <label for="email">Email</label>
        <input id="email" type="email"/>
        <label for="phone">Phone</label>
        <input id="phone" type="tel"/>
        <label for="url">Website</label>
        <input id="url" type="url"/>
        <label for="date">Date</label>
        <input id="date" type="date"/>
        <label for="plain-text">Whats going on?</label>
        <input id="plain-text" type="text"/>
    </div>
    <script src="${veformScriptSrc}"></s` +`cript>
</body>`,
css: defaultCss,        
js: `const builder = new Veform.VeformBuilder();
builder.addField({name: 'name', question: 'What is your name?', type: 'text'}).addValidation({
  validate: true,
  pattern: "name"
})
builder.addField({name: 'email', question: 'What is your email?', type: 'text'}).addValidation({
  validate: true,
  pattern: "email"
})
builder.addField({name: 'phone', question: 'What is your phone number?', type: 'text'}).addValidation({
  validate: true,
  pattern: "phone"
})
builder.addField({name: 'url', question: 'What is your website?', type: 'text'}).addValidation({
  validate: true,
  pattern: "url"
})
builder.addField({name: 'date', question: 'What is the date?', type: 'text'}).addValidation({
  validate: true,
  pattern: "date"
})

builder.addField({name: 'plain-text', question: 'Whats going on?', type: 'text'})

builder.addField({name: 'goodbye', question: 'Thanks for your time, Goodbye!', type: 'info'});
const veform = new Veform.Veform(builder);
veform.onFocusChanged((previous, next) => {
  document.getElementById(next).focus();
});
veform.onFieldValueChanged((fieldName, value) => {
    if (fieldName === 'date') {
        value = formatDate(value);
    }
  document.getElementById(fieldName).value = value;
});
veform.verbose = true;
veform.onFinished(() => {
console.log('veform finished called');
    veform.stop()
});
document.getElementById('start').addEventListener('click', () => {
  veform.start('whatever');
})

function formatDate(date) {
    const d = new Date(date);
    const month = d.getMonth() + 1;
    const day = d.getDate() + 1;
    return d.getFullYear() + '-' + (month < 10 ? '0' + month : month) + '-' + (day < 10 ? '0' + day : day);
}`}

js: `const builder = new Veform.VeformBuilder();
builder.addField({name: 'check-visit', question: 'Did you have a good visit?', type: 'yesNo'})
.addBehavior(Veform.FieldEvents.VALID_YES_ANSWER, {type: Veform.FieldBehaviorType.MOVE_TO, moveToFieldName: 'good-visit'})
.addBehavior(Veform.FieldEvents.VALID_NO_ANSWER, {type: Veform.FieldBehaviorType.MOVE_TO, moveToFieldName: 'bad-visit'})
.onChange((likedVisit) => {
    document.getElementById('check-visit').checked = likedVisit;
    if (likedVisit) {
        document.getElementById('good-visit-response').style.display = 'block';
    } else {
        document.getElementById('bad-visit-response-container').style.display = 'block';
    }
});

builder.addField({name: 'bad-visit', question: 'What can we do to make it better?', type: 'textarea'})
.addBehavior(Veform.FieldEvents.VALID_ANSWER, {type: Veform.FieldBehaviorType.MOVE_TO, moveToFieldName: 'goodbye'})
.onChange((value) => document.getElementById('bad-visit-response').value = value);

builder.addField({name: 'good-visit', question: 'Great to hear that!', type: 'info'});
builder.addField({name: 'goodbye', question: 'Thanks for answering our survey! Goodbye!', type: 'info'});

${jsSuffix}`
}

        </div>
        <div class="flex-centered">
            <label for="terminator-2">Terminator 2</label>
            <input id="terminator-2" type="checkbox"/>
        </div>
    </div>
    <script src="${veformScriptSrc}"></s` +`cript>
</body>`,
css: defaultCss,
js: `const builder = new Veform.VeformBuilder();
builder.addField({name: 'multiselect', question: 'Which of these classic movies have you seen?', type: 'multiselect'})
.addSelectOption({label: 'Total Recall', value: 'total-recall'})
.addSelectOption({label: 'Predator', value: 'predator'})
.addSelectOption({label: 'Terminator', value: 'terminator'})
.addSelectOption({label: 'Terminator 2', value: 'terminator-2'})
.onChange((value) => {
    console.log('multiselect value', value);
    const selections = value.split('|');
    selections.forEach(selection => {
        document.getElementById(selection).checked = true;
    });
});

builder.addField({name: 'goodbye', question: 'Interesting, thanks for your time! Goodbye!', type: 'info'});

${jsSuffix}`
}
        // Initialize CodeMirror editors
        const htmlEditor = CodeMirror.fromTextArea(document.getElementById('html-code'), {
            mode: 'htmlmixed',
            lineNumbers: true,
            autoCloseTags: true,
            autoCloseBrackets: true,
            indentUnit: 2,
            tabSize: 2,
            lineWrapping: true,
        });

        const cssEditor = CodeMirror.fromTextArea(document.getElementById('css-code'), {
            mode: 'css',
            lineNumbers: true,
            autoCloseBrackets: true,
            indentUnit: 2,
            tabSize: 2,
            lineWrapping: true
        });

        const jsEditor = CodeMirror.fromTextArea(document.getElementById('js-code'), {
            mode: 'javascript',
            lineNumbers: true,
            autoCloseBrackets: true,
            indentUnit: 2,
            tabSize: 2,
            lineWrapping: true
        });

        // Set default content
        htmlEditor.setValue(textTemplate.html);

        cssEditor.setValue(textTemplate.css);

        jsEditor.setValue(textTemplate.js);

        function switchTemplate(template) {
            switch (template) {
                case 'default':
                    break;
                case 'text':
                htmlEditor.setValue(textTemplate.html);
                    cssEditor.setValue(textTemplate.css);
                    jsEditor.setValue(textTemplate.js);
                    break;
                case 'textarea':
                    htmlEditor.setValue(textareaTemplate.html);
                    cssEditor.setValue(textareaTemplate.css);
                    jsEditor.setValue(textareaTemplate.js);
                    break;
                case 'number':
                    htmlEditor.setValue(numberTemplate.html);
                    cssEditor.setValue(numberTemplate.css);
                    jsEditor.setValue(numberTemplate.js);
                    break;
                case 'yesNo':
                    htmlEditor.setValue(yesNoTemplate.html);
                    cssEditor.setValue(yesNoTemplate.css);
                    jsEditor.setValue(yesNoTemplate.js);
                    break;
                case 'select':
                    htmlEditor.setValue(selectTemplate.html);
                    cssEditor.setValue(selectTemplate.css);
                    jsEditor.setValue(selectTemplate.js);
                    break;
                case 'multiselect':
                    htmlEditor.setValue(multiselectTemplate.html);
                    cssEditor.setValue(multiselectTemplate.css);
                    jsEditor.setValue(multiselectTemplate.js);
                    break;
                default:
                    htmlEditor.setValue(textTemplate.html);
                    cssEditor.setValue(textTemplate.css);
                    jsEditor.setValue(textTemplate.js);
                    break;
            }
            runCode()
        }
        // Tab switching
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Update editor containers
            document.querySelectorAll('.editor-container').forEach(e => e.classList.remove('active'));
            document.getElementById(`${tab}-editor`).classList.add('active');

            // Refresh the active editor
            if (tab === 'html') htmlEditor.refresh();
            if (tab === 'css') cssEditor.refresh();
            if (tab === 'js') jsEditor.refresh();
        }

        function runCode() {
            const html = htmlEditor.getValue();
            const css = cssEditor.getValue();
            const js = jsEditor.getValue();
            const iframe = document.getElementById('preview-frame');
            const content = "<!DOCTYPE html><html><head><style>" + css + "</style></head><body>" + html + "<script>" + js + "</scr" + "ipt></body></html>";
            iframe.srcdoc = content;
        }

        runCode();

  
    </script>
</body>
