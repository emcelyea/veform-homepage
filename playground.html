    <style>
        :root {
            --primary-light: #6FAE8D;
            --primary: #5A9B7A;
            --primary-dark: #4A8567;
            --secondary-dark: #66527D;
            --secondary: #8F7BA3;
            --accent: #E89B6E;
            --accent-dark: #C76A3A;
            --dark: #3D3426;
            --dark-light: #5A4F3F;
            --gray: #8B7E6B;
            --light: #E8DCC8;
            --white: #3D3426;
            --bg-main: #E8DCC8;
            --bg-alt: #F5EFE3;
        }
        html {
            height: 100%;
        }
        body {
            height: 100%;
            font-family: "Nunito Sans", -apple-system, BlinkMacSystemFont,
                "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", sans-serif;
            background: var(--bg-main);
            color: var(--white);
            overflow-x: hidden;
            margin: 0;
        }
    
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
    
        .container-inner {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            margin-top: 8px;
        }
        header {
            background: rgba(232, 220, 200, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(61, 52, 38, 0.2);
            box-shadow: 0 2px 10px rgba(61, 52, 38, 0.1);
        }
    
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            max-width: 1800px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        
        nav a {
            text-decoration: none;
        }
    
        .logo {
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--dark);
        }
    
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }
    
        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            transition: color 0.3s;
        }
    
        nav a:hover {
            color: var(--secondary);
        }
    
        .welcome-message {
            margin-top: 76px;
            margin-left: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
        }
        .welcome-message h3, p {
            margin: 0;
        }
        .welcome-message p {
            margin-left: 16px;
        }
        .main-content {
            display: flex;
            flex: 1;
            margin-top: 12px;
        }
    
        .editors {
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
            margin-bottom: 12px;
            min-height: 420px;
        }
    
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    
        .editor-tabs {
            display: flex;
        }
    
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            background: #2d2d30;
            color: var(--white);
            border: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            background: var(--bg-main);
        }
    
        .tab:hover {
            border-bottom-color: var(--primary);
            background: var(--bg-alt);
    
        }
    
        .tab.active {
            border-bottom-color: var(--primary);
            background: var(--bg-alt);
        }
    
        .run-button {
            background: var(--primary-dark);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            border: none;
            height: 32px;
        }
    
        .run-button:hover {
            background: var(--primary);
        }
    
        .run-button:active {
            transform: scale(0.98);
        }
    
        .editor-container {
            flex: 1;
            display: none;
            position: relative;
        }
    
        .editor-container.active {
            display: block;
            overflow: scroll;
        }
    
        .CodeMirror {
            height: 100% !important;
            font-size: 14px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }
    
        .preview {
            flex: 1;
            background: white;
            position: relative;
            margin-bottom: 12px;
            min-height: 420px;
        }
    
        .preview-header {
            background: var(--bg-main);
            padding: 10px 4px;
            color: var(--white);
            font-size: 16px;
            font-weight: 400;
        }
        .gutter {
            background: #f0f0f0;
            cursor: col-resize;
            position: relative;
            transition: background 0.2s ease;
            margin-top: 41px;
            min-height: 420px;
            height: calc(100% - 53px);
        }

        .gutter::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 40px;
            background: #ccc;
            border-radius: 2px;
            transition: background 0.2s ease, height 0.2s ease;
        }

        .gutter:hover {
            background: #e8e8e8;
        }

        .gutter:hover::after {
            background: #777;
            height: 60px;
        }

        .gutter:active::after {
            background: #777;
        }
    
        select {
            background: var(--bg-main);
            color: var(--white);
            font-size: 1rem;
            font-weight: 500;
            background: var(--bg-main);
            max-width: 180px;
            margin-left: 16px;
            padding: 6px;
            border-radius: 8px;
            outline: none;
        }
        #preview-frame {
            width: 100%;
            height: calc(100% - 45px);
            border: none;
            background: white;
        }
    
        @media (max-width: 920px) {
            .main-content {
                flex-direction: column;
                align-items: flex-start;
            }
            .welcome-message {
                flex-direction: column;
                gap: 8px;
            }
            .editors {
                border-right: none;
                order: 2;
                width: 100% !important;
            }
            .preview {
                width: 100% !important;
                order: 1;
            }
            .tab {
                padding: 12px 16px;
            }
            .welcome-message {
                text-align: center;
                margin-left: 0;
            }
            .run-button {
                margin-right: 4px;
            }
            .gutter {
                display: none;
            }
       
        }
    </style>
</head>

    const supportRequestTemplate = {
        html: `
<!-- 
    Demonstrates using select inputs to move conversation and UI down different branches.
-->
<body>
    <div class="container">
        <button id="start" class="start">Start conversation</button>
        <label for="issue-type">Issue type</label>
        <select id="issue-type">
            <option value="">-- Issue type --</option>
            <option value="technical-support">Technical Support</option>
            <option value="shipping-issue">Shipping Issue</option>
        </select>
        <div id="tech-support-section" style="display: none;">
            <p>Technical Support</p>
            <label for="tech-support-textarea">Can you describe the problem?</label>
            <textarea id="tech-support-textarea"></textarea>
            <label for="tech-support-email">Email</label>
            <input id="tech-support-email" type="email"/>
        </div>
        <div id="shipping-section" style="display: none;">
            <p>Shipping Issue</p>
            <label for="shipping-textarea">What went wrong?</label>
            <textarea id="shipping-textarea"></textarea>
            <label for="shipping-email">Email</label>
            <input id="shipping-email" type="email"/>
        </div>
        <div id="complete-section" style="display: none;">
            <p>Complete</p>
            <p>Thanks for your help, we will be in touch shortly!</p>
        </div>
    </div>
    <script src="${veformScriptSrc}"></s` +`cript>
</body>`,
    css: defaultCss,
    js: `const builder = new Veform.VeformBuilder({voice: {voice: 'female-1', language: 'en-GB'}});
builder.addField({name: 'type', question: 'Tech support or shipping issue?', type: 'select'})
.addSelectOption({label: 'Technical Support', value: 'technical-support',
behaviors: [{type: Veform.FieldBehaviorType.MOVE_TO, moveToFieldName: 'tech-support'}]})
.addSelectOption({label: 'Shipping issue', value: 'shipping-issue',
behaviors: [{type: Veform.FieldBehaviorType.MOVE_TO, moveToFieldName: 'shipping'}]})
.onChange((value) => {
    document.getElementById('issue-type').value = value;
    if (value === 'technical-support') {
        document.getElementById('tech-support-section').style.display = 'flex';
    } else if (value === 'shipping-issue') {
        document.getElementById('shipping-section').style.display = 'flex';
    }
})

builder.addField({name: 'tech-support', question: 'Can you describe your problem for tech support?', type: 'textarea'})
.addBehavior(Veform.FieldEvents.VALID_ANSWER, {type: Veform.FieldBehaviorType.MOVE_TO, moveToFieldName: 'user-email'})
.onChange((value) => {
    document.getElementById('tech-support-textarea').value = value;
})

builder.addField({name: 'shipping', question: 'What were your shipping issues?', type: 'textarea'})
.addBehavior(Veform.FieldEvents.VALID_ANSWER, {type: Veform.FieldBehaviorType.MOVE_TO, moveToFieldName: 'user-email'})
.onChange((value) => {
    document.getElementById('shipping-textarea').value = value;
})
builder.addField({name: 'user-email', question: 'What is the best email for us to get back to you at?', type: 'text'}).addValidation({
  validate: true,
  pattern: "email"
})
.onChange((value) => {
    document.getElementById('shipping-email').value = value;
    document.getElementById('tech-support-email').value = value;
})

builder.addField({name: 'review', question: 'Are you ready to submit?', type: 'yesNo'})
.addBehavior(Veform.FieldEvents.VALID_YES_ANSWER, {type: Veform.FieldBehaviorType.MOVE_TO, moveToFieldName: 'goodbye'})
.addBehavior(Veform.FieldEvents.VALID_NO_ANSWER, {type: Veform.FieldBehaviorType.MOVE_TO, moveToFieldName: 'revisit'})

builder.addField({name: 'revisit', question: 'What did you want to change?', type: 'text'})
builder.addField({name: 'goodbye', question: 'Thanks, we will be in touch!', type: 'info'});

const veform = new Veform.Veform(builder);
veform.onFinished(() => {
   document.getElementById('complete-section').style.display = 'flex';
   document.getElementById('shipping-section').style.display = 'none';
   document.getElementById('tech-support-section').style.display = 'none';
});
veform.verbose = true;
document.getElementById('start').addEventListener('click', () => {
    veform.start('${tokenUrl}');
});`}

    formValues[fieldName] = value;
});
veform.onAudioInStart(() => {
    document.getElementById('user-talking').style.display = 'block';
});
veform.onAudioInEnd((input) => {
    const userInput = document.createElement('p');
    userInput.textContent = input.text;
    userInput.classList.add('user-input');
    document.getElementById('conversation-container').appendChild(userInput);
    document.getElementById('user-talking').style.display = 'none';
});
veform.onAudioOutStart((chunk) => {
    document.getElementById('assistant-talking').style.display = 'block';
    const assistantResponse = document.createElement('p');
    assistantResponse.textContent = chunk.text;
    assistantResponse.classList.add('assistant-response');
    document.getElementById('conversation-container').appendChild(assistantResponse);
    document.getElementById('conversation-container').scrollTop = document.getElementById('conversation-container').scrollHeight;

});
veform.onAudioOutEnd(() => {
    document.getElementById('assistant-talking').style.display = 'none';
});
veform.onFinished(() => {
    console.log('Saving form values', formValues);
    const resultsContainer = document.getElementById('results-container');
    resultsContainer.style.display = 'flex';
    resultsContainer.innerHTML = JSON.stringify(formValues);
})
veform.verbose = true;
document.getElementById('start').addEventListener('click', (event) => {
event.target.disabled = true;
    veform.start('${tokenUrl}');
    document.getElementById('conversation-container').style.display = 'flex';
});`}

`,

    js: `
const builder = new Veform.VeformBuilder();
builder.addField({name: 'welcome', question: 'Lets review how your goals went.', type: 'info'});
document.getElementById('add-goal').addEventListener('click', () => {
    const goalInput = document.getElementById('goal');
    const goal = goalInput.value;
    addGoal(goal);
    goalInput.value = '';
    goalInput.focus();
    document.getElementById('start').disabled = false;
});

function addGoal(value) {
    const goalElement = document.createElement('div');
    goalElement.classList.add('goal-item');
    const goalQuestion = document.createElement('p');
    goalQuestion.textContent = value;
    goalElement.appendChild(goalQuestion);
    
    const goalsContainer = document.getElementById('goals-container');
    goalsContainer.appendChild(goalElement);
    const goalCount = goalsContainer.children.length;

    builder.addField({name: \`goal-\${goalCount}\`, question: \`Number \${goalCount}: \${value}\`, type: 'text'}).onChange((value) => {
        const goalResult = document.createElement('p');
        goalResult.textContent = value;
        goalElement.appendChild(goalResult);
    });
}
function startConversation() {
    if (!builder.getField('goodbye')) {
        builder.addField({name: 'goodbye', question: 'All done, goodbye!', type: 'info'});
    }
    const veform = new Veform.Veform(builder);
    veform.start('${tokenUrl}');
}
`
}

        // Initialize CodeMirror editors

            tabSize: 2,
            lineWrapping: true
        });

            mode: 'javascript',
            lineNumbers: true,
            autoCloseBrackets: true,
            indentUnit: 2,
            tabSize: 2,
            lineWrapping: true
        });

        // Set default content
        if (location.hash) {
            switchTemplate(location.hash.slice(1));
            document.getElementById('template-select').value = location.hash.slice(1);
        } else {
            htmlEditor.setValue(eventRegistrationTemplate.html);
            cssEditor.setValue(eventRegistrationTemplate.css);
            jsEditor.setValue(eventRegistrationTemplate.js);
        }

        function switchTemplate(template) {
            switch (template) {
                case 'default':
                    break;
                case 'dynamic-goal':
                    htmlEditor.setValue(dynamicGoalTemplate.html);
                    cssEditor.setValue(dynamicGoalTemplate.css);
                    jsEditor.setValue(dynamicGoalTemplate.js);
                    break;
                // case 'text':
                // htmlEditor.setValue(textTemplate.html);
                //     cssEditor.setValue(textTemplate.css);
                //     jsEditor.setValue(textTemplate.js);
                //     break;
                case 'support-request':
                    htmlEditor.setValue(supportRequestTemplate.html);
                    cssEditor.setValue(supportRequestTemplate.css);
                    jsEditor.setValue(supportRequestTemplate.js);
                    break;
                case 'event-registration':
                    htmlEditor.setValue(eventRegistrationTemplate.html);
                    cssEditor.setValue(eventRegistrationTemplate.css);
                    jsEditor.setValue(eventRegistrationTemplate.js);
                    break;
                case 'product-feedback':
                    htmlEditor.setValue(feedbackTemplate.html);
                    cssEditor.setValue(feedbackTemplate.css);
                    jsEditor.setValue(feedbackTemplate.js);
                    break;
                default:
                    htmlEditor.setValue(feedbackTemplate.html);
                    cssEditor.setValue(feedbackTemplate.css);
                    jsEditor.setValue(feedbackTemplate.js);
                    break;
            }
            location.hash = template;
            honTime('PLAYGROUND_TEMPLATE_SELECTED', uuid);
            runCode()
        }
        // Tab switching
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Update editor containers
            document.querySelectorAll('.editor-container').forEach(e => e.classList.remove('active'));
            document.getElementById(`${tab}-editor`).classList.add('active');

            // Refresh the active editor
            if (tab === 'html') htmlEditor.refresh();
            if (tab === 'css') cssEditor.refresh();
            if (tab === 'js') jsEditor.refresh();
        }

        function runCode() {
            const html = htmlEditor.getValue();
            const css = cssEditor.getValue();
            const js = jsEditor.getValue();
            const iframe = document.getElementById('preview-frame');
            const content = "<!DOCTYPE html><html><head><style>" + css + "</style></head><body>" + html + "<script>" + js + "</scr" + "ipt></body></html>";
            iframe.srcdoc = content;
            honTime('PLAYGROUND_CODE_RUN', uuid);
        }

        runCode();
        let uuid = localStorage.getItem('tempid');
    if (!uuid) {
      uuid = crypto.randomUUID();
      localStorage.setItem('tempid', uuid);
    }

        function honTime(name, id) {
      const xmlHttpRequest = new XMLHttpRequest();
      xmlHttpRequest.open('POST', honTimeUrl, true);
      xmlHttpRequest.setRequestHeader('Content-Type', 'application/json');
      xmlHttpRequest.send(JSON.stringify({name: name, id: id}));
    }
